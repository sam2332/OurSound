<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420">
  <defs>
    <radialGradient id="glow" cx="0.22" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#e3262f"/>
      <stop offset="1" stop-color="#8c0d14"/>
    </radialGradient>
    <clipPath id="card"><rect width="1280" height="420" rx="24"/></clipPath>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f2b233"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="url(#glow)"/>

    <!-- sunburst rays from the star -->
    <g transform="translate(250 210)" fill="#b3121b" opacity=".55">
      <path d="M0 0 L1400 -70 L1400 70Z"/>
      <path d="M0 0 L1400 -70 L1400 70Z" transform="rotate(20)"/>
      <path d="M0 0 L1400 -70 L1400 70Z" transform="rotate(40)"/>
      <path d="M0 0 L1400 -70 L1400 70Z" transform="rotate(60)"/>
      <path d="M0 0 L1400 -70 L1400 70Z" transform="rotate(80)"/>
      <path d="M0 0 L1400 -70 L1400 70Z" transform="rotate(100)"/>
      <path d="M0 0 L1400 -70 L1400 70Z" transform="rotate(120)"/>
      <path d="M0 0 L1400 -70 L1400 70Z" transform="rotate(140)"/>
      <path d="M0 0 L1400 -70 L1400 70Z" transform="rotate(160)"/>
      <path d="M0 0 L1400 -70 L1400 70Z" transform="rotate(180)"/>
      <path d="M0 0 L1400 -70 L1400 70Z" transform="rotate(200)"/>
      <path d="M0 0 L1400 -70 L1400 70Z" transform="rotate(220)"/>
      <path d="M0 0 L1400 -70 L1400 70Z" transform="rotate(240)"/>
      <path d="M0 0 L1400 -70 L1400 70Z" transform="rotate(260)"/>
      <path d="M0 0 L1400 -70 L1400 70Z" transform="rotate(280)"/>
      <path d="M0 0 L1400 -70 L1400 70Z" transform="rotate(300)"/>
      <path d="M0 0 L1400 -70 L1400 70Z" transform="rotate(320)"/>
      <path d="M0 0 L1400 -70 L1400 70Z" transform="rotate(340)"/>
    </g>

    <!-- headphones around a gold star -->
    <g transform="translate(250 210)">
      <path d="M-120 40 A120 120 0 0 1 120 40" fill="none" stroke="url(#gold)" stroke-width="22" stroke-linecap="round"/>
      <rect x="-150" y="20" width="56" height="96" rx="20" fill="url(#gold)"/>
      <rect x="94" y="20" width="56" height="96" rx="20" fill="url(#gold)"/>
      <path fill="url(#gold)" stroke="#8c0d14" stroke-width="4" stroke-linejoin="round"
        d="M0 -62 L18.2 -12.4 L71 -12.4 L28.6 18.6 L44.5 70 L0 39 L-44.5 70 L-28.6 18.6 L-71 -12.4 L-18.2 -12.4Z"/>
    </g>

    <!-- slogan band -->
    <rect x="470" y="300" width="900" height="64" fill="#1a0b0c" opacity=".85"/>

    <g font-family="Impact, 'Arial Black', 'Helvetica Neue', Arial, sans-serif">
      <text x="478" y="150" font-size="112" fill="#ffe08a" letter-spacing="2">OURSOUND</text>
      <text x="482" y="212" font-size="38" fill="#fff4dc" letter-spacing="3">NOT MY SOUND. NOT YOUR SOUND.</text>
      <text x="482" y="258" font-size="38" fill="#ffe08a" letter-spacing="3">OUR SOUND.</text>
      <text x="494" y="343" font-size="26" fill="#f2b233" letter-spacing="4">SLEEP AUDIO FOR THE PEOPLE · MADE LIVE, ALL NIGHT</text>
    </g>
  </g>
</svg>
