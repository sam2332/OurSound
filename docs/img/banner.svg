<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0d18"/>
      <stop offset="1" stop-color="#171b33"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8ea5ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8ea5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeX" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.88" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="edges"><rect width="1280" height="400" fill="url(#fadeX)"/></mask>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#c9d3ff">
    <circle cx="90" cy="60" r="1.6" opacity=".7"/><circle cx="210" cy="120" r="1.1" opacity=".5"/>
    <circle cx="340" cy="44" r="1.3" opacity=".6"/><circle cx="520" cy="88" r="1" opacity=".4"/>
    <circle cx="760" cy="40" r="1.4" opacity=".6"/><circle cx="880" cy="110" r="1" opacity=".45"/>
    <circle cx="1010" cy="70" r="1.2" opacity=".55"/><circle cx="1180" cy="140" r="1.5" opacity=".6"/>
    <circle cx="1220" cy="52" r="1" opacity=".4"/><circle cx="640" cy="150" r="1.1" opacity=".35"/>
    <circle cx="150" cy="190" r="1" opacity=".35"/><circle cx="1110" cy="200" r="1" opacity=".35"/>
  </g>

  <!-- moon -->
  <circle cx="1080" cy="110" r="120" fill="url(#moonglow)"/>
  <circle cx="1080" cy="110" r="38" fill="#e8ecff"/>
  <circle cx="1096" cy="98" r="34" fill="#141830"/>

  <!-- binaural waves: left ear, right ear, and the slow beat between them -->
  <g mask="url(#edges)" fill="none" stroke-linecap="round">
    <path stroke="#8ea5ff" stroke-width="3" opacity=".9"
      d="M0 300 C40 270 80 270 120 300 S200 330 240 300 S320 270 360 300 S440 330 480 300 S560 270 600 300 S680 330 720 300 S800 270 840 300 S920 330 960 300 S1040 270 1080 300 S1160 330 1200 300 S1280 270 1280 300"/>
    <path stroke="#f0a6ca" stroke-width="3" opacity=".85"
      d="M0 300 C38 274 76 274 114 300 S190 326 228 300 S304 274 342 300 S418 326 456 300 S532 274 570 300 S646 326 684 300 S760 274 798 300 S874 326 912 300 S988 274 1026 300 S1102 326 1140 300 S1216 274 1254 300"/>
    <path stroke="#7ed6c9" stroke-width="2" opacity=".55"
      d="M0 340 C160 310 320 310 480 340 S800 370 960 340 S1200 318 1280 330"/>
    <path stroke="#f2c278" stroke-width="2" opacity=".4"
      d="M0 250 C200 236 360 266 560 250 S920 236 1080 254 S1240 246 1280 250"/>
  </g>

  <!-- title -->
  <g font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="80" y="150" font-size="84" font-weight="700" fill="#eef1ff" letter-spacing="-1">OurSound</text>
    <text x="84" y="200" font-size="28" fill="#aab3d9">Sound for sleep, made live on your phone.</text>
    <text x="84" y="236" font-size="20" fill="#7f88b3">Binaural beats · rain · thunder · fans · drones · drums · all night, nothing pre-recorded</text>
  </g>
</svg>
